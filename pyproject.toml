[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-control-plane"
version = "0.1.0"
description = "Local-first control plane for a governed autonomous AI engineering studio"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Prasanna Kumar Palla" }]
keywords = ["ollama", "langgraph", "autonomous-agents", "local-first", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pip-audit>=2.7,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6,<7",
  "send2trash>=1.8,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/PrasannaKumarPalla/Ultron"
Issues = "https://github.com/PrasannaKumarPalla/Ultron/issues"
Changelog = "https://github.com/PrasannaKumarPalla/Ultron/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["httpx2>=2.10,<3", "pytest>=9.0.3,<10", "pytest-asyncio>=1.1,<2", "coverage>=7.6,<8", "pytest-cov>=6,<8", "pyinstaller>=6.22,<7", "pywebview>=6.1,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ultron = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/*.webmanifest", "ui/icons/*.png", "roles.yaml"]
bujji = ["**/*.toml", "**/*.json", "**/*.yaml", "**/*.yml", "**/*.js", "**/*.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
